    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Delius">

    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            /* Make body full height */
            background-color: black;
            /* Set background color to black */
        }

        .video-container {
            width: 100%;
            height: 100%;
            /* Make video container full height */
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            /* Required for watermark positioning */
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            /*  keeps aspect ratio */
            background-color: black;
        }

        .watermark {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: rgba(255, 255, 255, 0.8);
            /* Semi-transparent white */
            font-size: 20px;
            /* Increased font size */
            font-family: 'Arial', sans-serif;
            /* A more modern font */
            font-weight: bold;
            /* Make it bold */
            text-shadow: 2px 2px 4px #000000;
            /* Add a stronger text shadow */
            z-index: 10;
            /* Ensure it's above the video controls */
            padding: 5px 10px;
            /* Add some padding */
            background-color: rgba(0, 0, 0, 0.5);
            /* Optional: Add a semi-transparent background */
            border-radius: 5px;
            /* Optional: Round the corners */
        }
    </style>
</head>

<body>
    <div class="video-container">
        <video id="myVideo" controls autoplay>
            <source src="{{file_url}}" type="application/x-mpegURL">
                 <source src="{{file_url}}" type="video/mp4">
		    <source src="{{file_url}}" type="video/mkv">
            Your browser does not support HTML5 video.
        </video>
        <div class="watermark">KANHAIYA LAL MEENA KUWAL</div>
    </div>

    <script>
        const video = document.getElementById('myVideo');

        // Add playback speed options
        video.playbackRate = 1.0; // Default playback speed

        // Function to handle right click
        document.addEventListener("contextmenu", function (e) {
            e.preventDefault();
            // Show custom settings menu here (replace with your implementation)
            showSettingsMenu(e.clientX, e.clientY);
        });

        function showSettingsMenu(x, y) {
            // Example of a simple settings menu overlay
            const menu = document.createElement('div');
            menu.style.position = 'absolute';
            menu.style.left = x + 'px';
            menu.style.top = y + 'px';
            menu.style.backgroundColor = 'rgba(0, 0, 0, 0.8)';
            menu.style.color = 'white';
            menu.style.padding = '10px';
            menu.style.borderRadius = '5px';
            menu.style.zIndex = '1000';
            menu.innerHTML = `
                <button onclick="setPlaybackSpeed(0.5)">0.5x</button><br>
                <button onclick="setPlaybackSpeed(1.0)">1.0x</button><br>
                <button onclick="setPlaybackSpeed(1.5)">1.5x</button><br>
		<button onclick="setPlaybackSpeed(1.75)">1.75x</button><br>
                <button onclick="setPlaybackSpeed(2.0)">2.0x</button><br>
		<button onclick="setPlaybackSpeed(2.5)">2.5x</button><br>
                <button onclick="setPlaybackSpeed(3.0)">3.0x</button><br>
		<button onclick="setPlaybackSpeed(3.5)">3.5x</button><br>
                <button onclick="setPlaybackSpeed(4.0)">4.0x</button><br>
                <button onclick="closeSettingsMenu()">Close</button>
            `;
            document.body.appendChild(menu);

            // Store the menu element so we can close it later
            window.currentSettingsMenu = menu;
        }

        function setPlaybackSpeed(speed) {
            video.playbackRate = speed;
            closeSettingsMenu();
        }

        function closeSettingsMenu() {
            if (window.currentSettingsMenu) {
                document.body.removeChild(window.currentSettingsMenu);
                window.currentSettingsMenu = null;
            }
        }



        // Disabling other unwanted keys
        document.addEventListener('keydown', function (e) {
            if (
                e.key === 'F12' ||
                (e.ctrlKey && e.shiftKey && e.key === 'I') ||
                (e.ctrlKey && e.key === 'u') ||
                e.ctrlKey ||
                e.shiftKey ||
                e.altKey
            ) {
                e.preventDefault();
            }
        });
    </script>

    <script src="js/wow.min.js"></script>
    <script>
        new WOW().init();
    </script>
    <script>
        var div = document.getElementById('myDiv');
        var text = div.textContent;

        if (text.length > 60) {
            div.textContent = text.slice(0, 60) + "....";
        }
    </script>

</body>

</html>
